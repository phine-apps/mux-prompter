name: Test Mux Prompter Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq fzf

      - name: Setup Bats
        uses: bats-core/bats-action@3.0.0

      - name: Run test suite
        run: |
          bats tests/test_prompter.bats
